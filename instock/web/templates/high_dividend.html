{% extends "layout/default.html" %}

{% block main_content %}
<style>
    .high-dividend-page {
        min-height: 100%;
        background: #f6f8fb;
        color: #1f2937;
        padding: 18px 22px;
    }

    .high-dividend-toolbar {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: space-between;
        margin-bottom: 16px;
    }

    .high-dividend-title {
        margin: 0;
        font-size: 22px;
        font-weight: 600;
    }

    .high-dividend-meta {
        color: #667085;
        font-size: 13px;
        margin-top: 4px;
    }

    .high-dividend-actions {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
        gap: 18px;
    }

    .filter-control {
        align-items: center;
        display: inline-flex;
        gap: 6px;
        font-size: 14px;
        line-height: 30px;
        margin: 0;
        margin-right: 12px;
    }

    .filter-control input {
        margin: 0;
    }

    .snapshot-control {
        align-items: center;
        display: inline-flex;
        gap: 6px;
        font-size: 14px;
        line-height: 30px;
    }

    .snapshot-control input {
        border: 1px solid #cfd6e4;
        border-radius: 4px;
        color: #344054;
        height: 28px;
        padding: 2px 6px;
    }

    .snapshot-control button {
        background: #fff;
        border: 1px solid #cfd6e4;
        border-radius: 4px;
        color: #344054;
        height: 28px;
        line-height: 20px;
        padding: 3px 8px;
    }

    .snapshot-control button:hover {
        background: #f8fbff;
    }

    .details-column-hidden .details-column {
        display: none;
    }

    .table-shell {
        background: #fff;
        border: 1px solid #cfd6e4;
        border-radius: 4px;
        overflow: hidden;
    }

    .table-responsive {
        margin: 0;
        overflow-x: auto;
    }

    .high-dividend-table {
        border-collapse: separate;
        border-spacing: 0;
        table-layout: fixed;
        margin: 0;
        width: auto;
        min-width: 0;
    }

    .table.high-dividend-table > thead > tr > th {
        background: #eef2f7;
        border-bottom: 1px solid #b8c1d1;
        border-right: 1px solid #cfd6e4;
        color: #344054;
        font-size: 12px;
        font-weight: 600;
        height: 32px;
        line-height: 20px;
        padding: 6px 8px;
        position: relative;
        text-align: center;
        vertical-align: middle;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .table.high-dividend-table > thead > tr > th:last-child,
    .table.high-dividend-table > tbody > tr > td:last-child {
        border-right: 1px solid #d7ddea;
    }

    .column-resizer {
        bottom: 0;
        cursor: col-resize;
        position: absolute;
        right: -4px;
        top: 0;
        width: 8px;
        z-index: 3;
    }

    .column-resizer:hover,
    .column-resizer.is-dragging {
        background: rgba(37, 99, 235, 0.18);
    }

    .sortable-header {
        cursor: pointer;
        user-select: none;
    }

    .sort-icon {
        color: #98a2b3;
        margin-left: 4px;
    }

    .table.high-dividend-table > tbody > tr > td {
        border-bottom: 1px solid #e5e7eb;
        border-right: 1px solid #d7ddea;
        font-size: 13px;
        height: 28px;
        line-height: 20px;
        overflow: hidden;
        padding: 3px 8px;
        text-align: center;
        text-overflow: ellipsis;
        vertical-align: middle;
        white-space: nowrap;
    }

    .high-dividend-table tbody tr:hover td {
        background: #f8fbff;
    }

    .number-cell {
        font-variant-numeric: tabular-nums;
        text-align: center;
        white-space: nowrap;
    }

    .yield-cell {
        color: #067647;
        font-weight: 600;
    }

    .warning-blue-cell {
        background: #B5D7FF;
    }

    .high-dividend-table tbody tr:hover td.warning-blue-cell {
        background: #B5D7FF;
    }

    .changed-name {
        color: #b42318;
        font-weight: 600;
    }

    .position-cell-editor {
        border: 1px solid transparent;
        line-height: 20px;
        min-height: 20px;
        outline: none;
        padding: 0 3px;
        width: 100%;
    }

    .position-cell-editor:focus {
        background: #fff;
        border-color: #2563eb;
        box-shadow: inset 0 0 0 1px #2563eb;
    }

    .position-cell-editor.is-saved {
        box-shadow: inset 0 0 0 1px #12b76a;
    }

    .position-cell-editor.is-error {
        box-shadow: inset 0 0 0 1px #f04438;
    }

    .manual-number-editor {
        border: 1px solid transparent;
        line-height: 20px;
        min-height: 20px;
        outline: none;
        padding: 0 3px;
        width: 100%;
    }

    .manual-number-editor:focus {
        background: #fff;
        border-color: #2563eb;
        box-shadow: inset 0 0 0 1px #2563eb;
    }

    .manual-number-editor.is-saved {
        box-shadow: inset 0 0 0 1px #12b76a;
    }

    .manual-number-editor.is-error {
        box-shadow: inset 0 0 0 1px #f04438;
    }

    .manual-number-editor.is-stale {
        color: #b42318;
        font-weight: 600;
    }

    .details-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 280px;
    }

    .detail-line {
        color: #475467;
        line-height: 1.45;
    }

    .detail-main {
        color: #111827;
        font-weight: 500;
    }

    .status-pill {
        background: #eef4ff;
        border: 1px solid #c7d7fe;
        border-radius: 999px;
        color: #3538cd;
        display: inline-block;
        font-size: 12px;
        line-height: 1.2;
        margin-left: 6px;
        padding: 2px 7px;
        white-space: nowrap;
    }

    .details-toggle {
        align-items: center;
        background: transparent;
        border: 0;
        color: #111827;
        display: inline-flex;
        gap: 5px;
        line-height: 20px;
        padding: 0;
    }

    .details-toggle:focus,
    .details-toggle:hover {
        color: #111827;
        outline: none;
        text-decoration: underline;
    }

    .details-cell {
        text-align: center;
        white-space: nowrap;
    }

    .details-popover {
        background: #fff;
        border: 1px solid #b8c1d1;
        box-shadow: 0 12px 28px rgba(16, 24, 40, 0.18);
        display: none;
        max-width: 520px;
        padding: 10px 12px;
        position: fixed;
        text-align: left;
        z-index: 1050;
    }

    .details-popover.is-open {
        display: block;
    }

    .empty-state,
    .error-state {
        color: #667085;
        padding: 22px;
        text-align: center;
    }

    .error-state {
        color: #b42318;
    }

    @media (max-width: 768px) {
        .high-dividend-page {
            padding: 14px;
        }

        .high-dividend-actions {
            width: 100%;
        }
    }
</style>

<div class="high-dividend-page">
    <div class="high-dividend-toolbar">
        <div>
            <h1 class="high-dividend-title">高股息列表</h1>
            <div class="high-dividend-meta">
                <span id="updatedAt"></span>
            </div>
        </div>
        <div class="high-dividend-actions">
            <label class="snapshot-control">
                <span>快照</span>
                <input id="snapshotDateInput" type="date" list="snapshotDateOptions">
                <datalist id="snapshotDateOptions"></datalist>
                <button id="snapshotRealtimeButton" type="button">实时</button>
            </label>
            <label class="filter-control" title="勾选后隐藏仓位为0且窄口径FCF为负或扣非低于-10%的股票">
                <span>过滤</span>
                <input id="negativeFcfFilter" type="checkbox" checked>
            </label>
        </div>
    </div>

    <div class="table-shell">
        <div class="table-responsive">
            <table id="highDividendTable" class="table table-hover high-dividend-table">
                <colgroup>
                    <col style="width: 86px;">
                    <col style="width: 132px;">
                    <col style="width: 132px;">
                    <col style="width: 96px;">
                    <col style="width: 96px;">
                    <col style="width: 96px;">
                    <col style="width: 96px;">
                    <col style="width: 96px;">
                    <col style="width: 112px;">
                    <col style="width: 112px;">
                    <col style="width: 112px;">
                    <col style="width: 112px;">
                    <col style="width: 112px;">
                    <col style="width: 112px;">
                    <col style="width: 112px;">
                    <col style="width: 112px;">
                    <col style="width: 112px;">
                    <col class="details-column" style="width: 342px;">
                </colgroup>
                <thead>
                    <tr>
                        <th>代码<span class="column-resizer"></span></th>
                        <th class="sortable-header" data-sort-key="name">名称<i class="fa fa-sort sort-icon"></i><span class="column-resizer"></span></th>
                        <th class="sortable-header" data-sort-key="position">仓位<i class="fa fa-sort sort-icon"></i><span class="column-resizer"></span></th>
                        <th class="number-cell sortable-header" data-sort-key="deducted_profit_growth">扣非<i class="fa fa-sort sort-icon"></i><span class="column-resizer"></span></th>
                        <th class="number-cell sortable-header" data-sort-key="diluted_eps">收益<i class="fa fa-sort sort-icon"></i><span class="column-resizer"></span></th>
                        <th class="number-cell">派息<span class="column-resizer"></span></th>
                        <th class="number-cell">股价<span class="column-resizer"></span></th>
                        <th class="number-cell sortable-header" data-sort-key="dividend_yield">股息率<i class="fa fa-sort sort-icon"></i><span class="column-resizer"></span></th>
                        <th class="number-cell">股息增长年<span class="column-resizer"></span></th>
                        <th class="number-cell">窄口径FCF<span class="column-resizer"></span></th>
                        <th class="number-cell">FCF/股息<span class="column-resizer"></span></th>
                        <th class="number-cell sortable-header" data-sort-key="fcf_price">FCF/股价<i class="fa fa-sort sort-icon"></i><span class="column-resizer"></span></th>
                        <th class="number-cell sortable-header" data-sort-key="ma120_position">日MA120<i class="fa fa-sort sort-icon"></i><span class="column-resizer"></span></th>
                        <th class="number-cell sortable-header" data-sort-key="value_bet_rate">值博率<i class="fa fa-sort sort-icon"></i><span class="column-resizer"></span></th>
                        <th class="number-cell sortable-header" data-sort-key="value_bet_rate_change_1">值博1<i class="fa fa-sort sort-icon"></i><span class="column-resizer"></span></th>
                        <th class="number-cell sortable-header" data-sort-key="value_bet_rate_change_7">值博7<i class="fa fa-sort sort-icon"></i><span class="column-resizer"></span></th>
                        <th class="number-cell sortable-header" data-sort-key="value_bet_rate_change_21">值博21<i class="fa fa-sort sort-icon"></i><span class="column-resizer"></span></th>
                        <th class="details-column">派息明细<span class="column-resizer"></span></th>
                    </tr>
                </thead>
                <tbody id="dividendRows">
                    <tr>
                        <td class="empty-state" colspan="18">加载中...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<div id="detailsPopover" class="details-popover"></div>

<script type="text/javascript">
    let highDividendRows = [];
    let sortState = {
        key: "name",
        direction: "asc"
    };
    const FILTER_STORAGE_KEY = "highDividendNegativeFcfFilterEnabled";
    let isSnapshotMode = false;

    function formatNumber(value, digits) {
        if (value === null || value === undefined || Number.isNaN(Number(value))) {
            return "--";
        }
        return Number(value).toFixed(digits);
    }

    function formatPercent(value) {
        if (value === null || value === undefined || Number.isNaN(Number(value))) {
            return "--";
        }
        return Number(value).toFixed(2) + "%";
    }

    function formatBlankPercent(value) {
        if (value === null || value === undefined || value === "" || Number.isNaN(Number(value))) {
            return "";
        }
        return Number(value).toFixed(2) + "%";
    }

    function formatSignedPercent(value) {
        if (value === null || value === undefined || value === "" || Number.isNaN(Number(value))) {
            return "";
        }
        const number = Number(value);
        return (number > 0 ? "+" : "") + number.toFixed(2) + "%";
    }

    function formatPosition(value) {
        const text = String(value || "").trim();
        if (!text) {
            return "";
        }
        if (text.endsWith("%")) {
            return text;
        }
        return text + "%";
    }

    function normalizePosition(value) {
        const text = String(value || "").trim().replace(/%/g, "");
        const match = text.replace(/,/g, "").match(/-?\d+(\.\d+)?/);
        return match ? match[0] : "";
    }

    function formatOptionalNumber(value, digits) {
        if (value === null || value === undefined || value === "" || Number.isNaN(Number(value))) {
            return "";
        }
        return Number(value).toFixed(digits);
    }

    function normalizeNumber(value) {
        const text = String(value || "").trim().replace(/,/g, "");
        const match = text.match(/-?\d+(\.\d+)?/);
        return match ? match[0] : "";
    }

    function escapeHtml(value) {
        return String(value || "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function renderDetails(details) {
        if (!details || details.length === 0) {
            return '<span class="text-muted">无派息记录</span>';
        }

        return '<div class="details-list">' + details.map(function(item) {
            const dateText = item.ex_dividend_date ? '除息 ' + item.ex_dividend_date : '未除息';
            return [
                '<div class="detail-line">',
                '<span class="detail-main">',
                escapeHtml(item.report_date),
                '：',
                escapeHtml(item.plan || ('10派' + formatNumber(item.cash_per_10, 2) + '元')),
                '</span>',
                '<span class="status-pill">',
                escapeHtml(item.progress || "待公告"),
                '</span>',
                '<br>',
                escapeHtml(dateText),
                item.notice_date ? '，公告 ' + escapeHtml(item.notice_date) : '',
                '</div>'
            ].join('');
        }).join('') + '</div>';
    }

    function compareRows(left, right) {
        const leftPinned = Boolean(left && (left.dividend_changed || left.finance_report_changed));
        const rightPinned = Boolean(right && (right.dividend_changed || right.finance_report_changed));
        if (leftPinned !== rightPinned) {
            return leftPinned ? -1 : 1;
        }

        const direction = sortState.direction === "asc" ? 1 : -1;
        if (sortState.key === "name") {
            return direction * String(left.name || "").localeCompare(String(right.name || ""), "zh-Hans-CN");
        }
        if (sortState.key === "position") {
            return direction * (parsePositionValue(left.position) - parsePositionValue(right.position));
        }
        if (sortState.key === "deducted_profit_growth") {
            return direction * (parseNullableNumber(left.deducted_profit_growth) - parseNullableNumber(right.deducted_profit_growth));
        }
        if (sortState.key === "diluted_eps") {
            return direction * (parseNullableNumber(left.diluted_eps) - parseNullableNumber(right.diluted_eps));
        }
        if (sortState.key === "fcf_price") {
            return direction * (parseNullableNumber(left.fcf_price) - parseNullableNumber(right.fcf_price));
        }
        if (sortState.key === "ma120_position") {
            return direction * (parseNullableNumber(left.ma120_position) - parseNullableNumber(right.ma120_position));
        }
        if (sortState.key === "value_bet_rate") {
            return direction * (parseNullableNumber(left.value_bet_rate) - parseNullableNumber(right.value_bet_rate));
        }
        if (sortState.key === "value_bet_rate_change_1") {
            return direction * (parseNullableNumber(left.value_bet_rate_change_1) - parseNullableNumber(right.value_bet_rate_change_1));
        }
        if (sortState.key === "value_bet_rate_change_7") {
            return direction * (parseNullableNumber(left.value_bet_rate_change_7) - parseNullableNumber(right.value_bet_rate_change_7));
        }
        if (sortState.key === "value_bet_rate_change_21") {
            return direction * (parseNullableNumber(left.value_bet_rate_change_21) - parseNullableNumber(right.value_bet_rate_change_21));
        }

        const leftValue = left.dividend_yield === null || left.dividend_yield === undefined ? -Infinity : Number(left.dividend_yield);
        const rightValue = right.dividend_yield === null || right.dividend_yield === undefined ? -Infinity : Number(right.dividend_yield);
        return direction * (leftValue - rightValue);
    }

    function parseNullableNumber(value) {
        if (value === null || value === undefined || value === "" || Number.isNaN(Number(value))) {
            return -Infinity;
        }
        return Number(value);
    }

    function parsePositionValue(value) {
        if (value === null || value === undefined || String(value).trim() === "") {
            return 0;
        }
        const match = String(value).replace(/,/g, "").match(/-?\d+(\.\d+)?/);
        return match ? Number(match[0]) : 0;
    }

    function sortedRows(rows) {
        return (rows || []).slice().sort(compareRows);
    }

    function shouldHideByFilter(row) {
        if (!document.getElementById("negativeFcfFilter").checked) {
            return false;
        }
        if (parsePositionValue(row.position) > 0) {
            return false;
        }

        const hasNegativeFcf = !(
            row.narrow_fcf === null
            || row.narrow_fcf === undefined
            || row.narrow_fcf === ""
            || Number.isNaN(Number(row.narrow_fcf))
        ) && Number(row.narrow_fcf) < 0;
        const hasWeakDeductedProfit = !(
            row.deducted_profit_growth === null
            || row.deducted_profit_growth === undefined
            || row.deducted_profit_growth === ""
            || Number.isNaN(Number(row.deducted_profit_growth))
        ) && Number(row.deducted_profit_growth) < -10;

        return hasNegativeFcf || hasWeakDeductedProfit;
    }

    function visibleRows(rows) {
        return (rows || []).filter(function(row) {
            return !shouldHideByFilter(row);
        });
    }

    function displayedRows(rows) {
        return sortedRows(visibleRows(rows));
    }

    function isFilterEnabled() {
        return document.getElementById("negativeFcfFilter").checked;
    }

    function loadFilterState() {
        const savedValue = window.localStorage.getItem(FILTER_STORAGE_KEY);
        if (savedValue === null) {
            return;
        }
        document.getElementById("negativeFcfFilter").checked = savedValue === "true";
    }

    function saveFilterState() {
        window.localStorage.setItem(FILTER_STORAGE_KEY, String(isFilterEnabled()));
    }

    function updateDetailsColumnVisibility() {
        $("#highDividendTable").toggleClass("details-column-hidden", isFilterEnabled());
        hideDetailsPopover();
    }

    function tableColumnCount() {
        return isFilterEnabled() ? 17 : 18;
    }

    function updateSortIcons() {
        $(".sortable-header").each(function() {
            const header = $(this);
            const icon = header.find(".sort-icon");
            icon.removeClass("fa-sort fa-sort-asc fa-sort-desc");
            if (header.data("sort-key") === sortState.key) {
                icon.addClass(sortState.direction === "asc" ? "fa-sort-asc" : "fa-sort-desc");
            } else {
                icon.addClass("fa-sort");
            }
        });
    }

    function renderRows(rows) {
        const tbody = document.getElementById("dividendRows");
        const displayRows = displayedRows(rows);
        if (displayRows.length === 0) {
            tbody.innerHTML = '<tr><td class="empty-state" colspan="' + tableColumnCount() + '">暂无数据</td></tr>';
            return;
        }

        tbody.innerHTML = displayRows.map(function(row, index) {
            const detailCount = row.details ? row.details.length : 0;
            const detailsCell = isFilterEnabled() ? '' : [
                '<td class="details-cell details-column">',
                '<button type="button" class="details-toggle" data-details-index="',
                index,
                '"',
                detailCount === 0 ? ' disabled' : '',
                '><i class="fa fa-info-circle"></i>',
                detailCount > 0 ? '查看 ' + detailCount + ' 条' : '无明细',
                '</button>',
                '</td>'
            ].join('');
            return [
                '<tr>',
                '<td><a href="https://quote.eastmoney.com/' + (row.code.charAt(0) === '6' ? 'sh' : 'sz') + row.code + '.html" target="_blank" rel="noopener noreferrer">',
                escapeHtml(row.code),
                '</a></td>',
                '<td class="',
                (row.dividend_changed || row.finance_report_changed) ? 'changed-name' : '',
                '">',
                escapeHtml(row.name),
                '</td>',
                '<td>',
                '<div class="position-cell-editor" contenteditable="',
                isSnapshotMode ? 'false' : 'true',
                '" data-code="',
                escapeHtml(row.code),
                '" data-last-saved-value="',
                escapeHtml(row.position || ""),
                '">',
                escapeHtml(formatPosition(row.position)),
                '</div>',
                '</td>',
                '<td class="number-cell',
                Number(row.deducted_profit_growth) < -10 ? ' warning-blue-cell' : '',
                '" title="',
                escapeHtml(row.deducted_profit_growth_report_name ? row.deducted_profit_growth_report_name + '，公告 ' + (row.deducted_profit_growth_notice_date || '--') : ''),
                '">',
                formatBlankPercent(row.deducted_profit_growth),
                '</td>',
                '<td class="number-cell">',
                formatOptionalNumber(row.diluted_eps, 2),
                '</td>',
                '<td class="number-cell">',
                formatNumber(row.dividend_per_share, 2),
                '</td>',
                '<td class="number-cell">',
                formatNumber(row.current_price, 2),
                '</td>',
                '<td class="number-cell',
                parsePositionValue(row.position) > 0 ? ' yield-cell' : '',
                '">',
                formatPercent(row.dividend_yield),
                '</td>',
                '<td class="number-cell">',
                formatNumber(row.dividend_growth_years, 0),
                '</td>',
                '<td class="number-cell" title="',
                escapeHtml(row.narrow_fcf_source === 'manual' ? (row.manual_narrow_fcf_stale ? '手动覆盖；年报已更新，请重新填写' : '手动覆盖；清空后使用抓取默认值') : ''),
                '">',
                '<div class="manual-number-editor',
                row.manual_narrow_fcf_stale ? ' is-stale' : '',
                '" contenteditable="',
                isSnapshotMode ? 'false' : 'true',
                '" data-field="narrow_fcf" data-code="',
                escapeHtml(row.code),
                '" data-last-saved-value="',
                escapeHtml(formatOptionalNumber(row.narrow_fcf, 2)),
                '">',
                escapeHtml(formatOptionalNumber(row.narrow_fcf, 2)),
                '</div>',
                '</td>',
                '<td class="number-cell fcf-dividend-cell">',
                formatBlankPercent(row.fcf_dividend === null || row.fcf_dividend === undefined ? null : row.fcf_dividend * 100),
                '</td>',
                '<td class="number-cell fcf-price-cell">',
                formatBlankPercent(row.fcf_price),
                '</td>',
                '<td class="number-cell" title="',
                escapeHtml(row.ma120_trade_date ? row.ma120_trade_date + ' 收盘 ' + formatNumber(row.ma120_close_price, 2) + ' / MA120 ' + formatNumber(row.ma120, 2) : ''),
                '">',
                formatBlankPercent(row.ma120_position),
                '</td>',
                '<td class="number-cell',
                parsePositionValue(row.position) > 0 ? ' yield-cell' : '',
                '">',
                formatBlankPercent(row.value_bet_rate),
                '</td>',
                '<td class="number-cell" title="',
                escapeHtml(row.previous_value_bet_rate_date_1 ? '基准 ' + row.previous_value_bet_rate_date_1 + '：' + formatBlankPercent(row.previous_value_bet_rate_1) : ''),
                '">',
                formatSignedPercent(row.value_bet_rate_change_1),
                '</td>',
                '<td class="number-cell" title="',
                escapeHtml(row.previous_value_bet_rate_date_7 ? '基准 ' + row.previous_value_bet_rate_date_7 + '：' + formatBlankPercent(row.previous_value_bet_rate_7) : ''),
                '">',
                formatSignedPercent(row.value_bet_rate_change_7),
                '</td>',
                '<td class="number-cell" title="',
                escapeHtml(row.previous_value_bet_rate_date_21 ? '基准 ' + row.previous_value_bet_rate_date_21 + '：' + formatBlankPercent(row.previous_value_bet_rate_21) : ''),
                '">',
                formatSignedPercent(row.value_bet_rate_change_21),
                '</td>',
                detailsCell,
                '</tr>'
            ].join('');
        }).join('');
        updateSortIcons();
    }

    function renderSummary(payload) {
        const prefix = payload.is_snapshot && payload.snapshot_date ? "快照 " + payload.snapshot_date + " / " : "更新 ";
        document.getElementById("updatedAt").textContent = payload.generated_at ? prefix + payload.generated_at : "";
    }

    function getSelectedSnapshotDate() {
        return $("#snapshotDateInput").val();
    }

    function updateSnapshotDateOptions(dates) {
        const normalizedDates = dates || [];
        $("#snapshotDateOptions").html(normalizedDates.map(function(date) {
            return '<option value="' + escapeHtml(date) + '"></option>';
        }).join(''));
        if (normalizedDates.length > 0) {
            $("#snapshotDateInput").attr({
                max: normalizedDates[0],
                min: normalizedDates[normalizedDates.length - 1]
            });
        }
    }

    function loadHighDividendList() {
        const tbody = document.getElementById("dividendRows");
        const snapshotDate = getSelectedSnapshotDate();
        const requestUrl = snapshotDate
            ? "/instock/high_dividend/api?snapshot_date=" + encodeURIComponent(snapshotDate)
            : "/instock/high_dividend/api";

        tbody.innerHTML = '<tr><td class="empty-state" colspan="' + tableColumnCount() + '">加载中...</td></tr>';

        $.getJSON(requestUrl)
            .done(function(payload) {
                isSnapshotMode = !!payload.is_snapshot;
                updateSnapshotDateOptions(payload.snapshot_dates);
                renderSummary(payload);
                highDividendRows = payload.data || [];
                renderRows(highDividendRows);
                if (payload.errors && payload.errors.length > 0) {
                    console.warn(payload.errors.join("\\n"));
                }
            })
            .fail(function(xhr) {
                let message = xhr.statusText || xhr.status;
                if (xhr.responseJSON && xhr.responseJSON.message) {
                    message = xhr.responseJSON.message;
                    updateSnapshotDateOptions(xhr.responseJSON.snapshot_dates);
                }
                tbody.innerHTML = '<tr><td class="error-state" colspan="' + tableColumnCount() + '">数据读取失败：' + escapeHtml(message) + '</td></tr>';
            });
    }

    function startAfterCloseDividendRefresh() {
        window.setInterval(function() {
            const hour = new Date().getHours();
            if (!getSelectedSnapshotDate() && hour >= 16 && hour <= 23) {
                loadHighDividendList();
            }
        }, 60 * 60 * 1000);
    }

    function savePosition(input) {
        const target = $(input);
        const code = target.attr("data-code");
        const position = normalizePosition(target.text());
        target.text(formatPosition(position));
        target.removeClass("is-saved is-error");
        $.post("/instock/high_dividend/position", {
            code: code,
            position: position
        }).done(function() {
            const row = highDividendRows.find(function(item) {
                return String(item.code) === code;
            });
            if (row) {
                row.position = position;
                if (shouldHideByFilter(row)) {
                    renderRows(highDividendRows);
                    return;
                }
            }
            target.addClass("is-saved");
            window.setTimeout(function() {
                target.removeClass("is-saved");
            }, 1200);
        }).fail(function() {
            target.addClass("is-error");
        });
    }

    function saveNarrowFcf(input) {
        const target = $(input);
        const code = target.attr("data-code");
        const narrowFcf = normalizeNumber(target.text());
        const previousSavedValue = target.attr("data-last-saved-value") || "";
        target.text(formatOptionalNumber(narrowFcf, 2));
        target.removeClass("is-saved is-error");
        $.post("/instock/high_dividend/fcf", {
            code: code,
            narrow_fcf: narrowFcf
        }).done(function(response) {
            if (typeof response === "string") {
                response = JSON.parse(response);
            }
            const row = highDividendRows.find(function(item) {
                return String(item.code) === code;
            });
            if (row) {
                row.narrow_fcf = response.narrow_fcf;
                row.manual_narrow_fcf = response.manual_narrow_fcf;
                row.manual_narrow_fcf_report_date = response.manual_narrow_fcf_report_date;
                row.manual_narrow_fcf_stale = response.manual_narrow_fcf_stale;
                row.default_narrow_fcf = response.default_narrow_fcf;
                row.narrow_fcf_source = response.narrow_fcf_source;
                row.fcf_dividend = response.fcf_dividend;
                row.fcf_price = response.fcf_price;
                target.attr("data-last-saved-value", formatOptionalNumber(row.narrow_fcf, 2));
                const tableRow = target.closest("tr");
                target.text(formatOptionalNumber(row.narrow_fcf, 2));
                target.toggleClass("is-stale", !!row.manual_narrow_fcf_stale);
                target.closest("td").attr("title", row.narrow_fcf_source === 'manual' ? (row.manual_narrow_fcf_stale ? '手动覆盖；年报已更新，请重新填写' : '手动覆盖；清空后使用抓取默认值') : '');
                tableRow.find(".fcf-dividend-cell").text(
                    formatBlankPercent(row.fcf_dividend === null || row.fcf_dividend === undefined ? null : row.fcf_dividend * 100)
                );
                tableRow.find(".fcf-price-cell").text(formatBlankPercent(row.fcf_price));
            }
            target.addClass("is-saved");
            window.setTimeout(function() {
                target.removeClass("is-saved");
            }, 1200);
        }).fail(function() {
            target.text(previousSavedValue);
            target.addClass("is-error");
        });
    }

    function showDetailsPopover(button) {
        const target = $(button);
        const index = Number(target.data("details-index"));
        const row = displayedRows(highDividendRows)[index];
        const popover = $("#detailsPopover");
        popover.html(renderDetails(row ? row.details : []));
        const rect = button.getBoundingClientRect();
        popover.css({
            left: Math.min(rect.left, window.innerWidth - 540) + "px",
            top: Math.min(rect.bottom + 6, window.innerHeight - 240) + "px"
        });
        popover.addClass("is-open");
    }

    function hideDetailsPopover() {
        $("#detailsPopover").removeClass("is-open");
    }

    function loadColumnWidths() {
        try {
            return JSON.parse(window.localStorage.getItem("highDividendColumnWidths") || "[]");
        } catch (error) {
            return [];
        }
    }

    function saveColumnWidths(widths) {
        window.localStorage.setItem("highDividendColumnWidths", JSON.stringify(widths));
    }

    function applyColumnWidths() {
        const widths = loadColumnWidths();
        const cols = $(".high-dividend-table col");
        widths.forEach(function(width, index) {
            if (width && cols[index]) {
                cols[index].style.width = width + "px";
            }
        });
    }

    function initColumnResizing() {
        applyColumnWidths();
        $(".column-resizer").on("mousedown", function(event) {
            event.preventDefault();
            event.stopPropagation();
            const handle = $(this);
            const th = handle.closest("th")[0];
            const index = $(th).index();
            const col = $(".high-dividend-table col")[index];
            const startX = event.pageX;
            const startWidth = parseInt($(col).width(), 10) || parseInt($(th).outerWidth(), 10);
            const minWidth = Math.max(64, startWidth - 160);
            const maxWidth = startWidth + 220;
            handle.addClass("is-dragging");

            $(document).on("mousemove.highDividendResize", function(moveEvent) {
                const nextWidth = Math.min(maxWidth, Math.max(minWidth, startWidth + moveEvent.pageX - startX));
                col.style.width = nextWidth + "px";
            });

            $(document).on("mouseup.highDividendResize", function() {
                const widths = $(".high-dividend-table col").map(function() {
                    return parseInt($(this).width(), 10);
                }).get();
                saveColumnWidths(widths);
                handle.removeClass("is-dragging");
                $(document).off(".highDividendResize");
            });
        });
    }

    $(document).ready(function() {
        initColumnResizing();
        loadFilterState();
        $("#negativeFcfFilter").on("change", function() {
            saveFilterState();
            updateDetailsColumnVisibility();
            renderRows(highDividendRows);
        });
        $("#snapshotDateInput").on("change", function() {
            loadHighDividendList();
        });
        $("#snapshotRealtimeButton").on("click", function() {
            $("#snapshotDateInput").val("");
            loadHighDividendList();
        });
        updateDetailsColumnVisibility();
        $(".sortable-header").on("click", function() {
            const key = $(this).data("sort-key");
            if (sortState.key === key) {
                sortState.direction = sortState.direction === "asc" ? "desc" : "asc";
            } else {
                sortState.key = key;
                sortState.direction = key === "name" ? "asc" : "desc";
            }
            renderRows(highDividendRows);
        });
        $("#dividendRows").on("mouseenter focus click", ".details-toggle", function(event) {
            event.stopPropagation();
            showDetailsPopover(this);
        });
        $("#dividendRows").on("mouseleave", ".details-toggle", function() {
            window.setTimeout(function() {
                if (!$("#detailsPopover:hover").length) {
                    hideDetailsPopover();
                }
            }, 120);
        });
        $("#detailsPopover").on("mouseleave", hideDetailsPopover);
        $(document).on("click", function() {
            hideDetailsPopover();
        });
        $("#dividendRows").on("blur", ".position-cell-editor", function() {
            if (isSnapshotMode) {
                return;
            }
            const value = $(this).text().trim();
            const position = normalizePosition(value);
            if (this.dataset.lastSavedValue === position) {
                return;
            }
            this.dataset.lastSavedValue = position;
            savePosition(this);
        });
        $("#dividendRows").on("keydown", ".position-cell-editor", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                this.blur();
            }
        });
        $("#dividendRows").on("blur", ".manual-number-editor", function() {
            if (isSnapshotMode) {
                return;
            }
            const value = formatOptionalNumber(normalizeNumber($(this).text()), 2);
            if (this.dataset.lastSavedValue === value) {
                $(this).text(value);
                return;
            }
            saveNarrowFcf(this);
        });
        $("#dividendRows").on("keydown", ".manual-number-editor", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                this.blur();
            }
        });
        loadHighDividendList();
        startAfterCloseDividendRefresh();
    });
</script>
{% end %}
