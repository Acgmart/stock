{% extends "layout/default.html" %}

{% block main_content %}
<style>
    .high-dividend-page {
        min-height: 100%;
        background: #f6f8fb;
        color: #1f2937;
        padding: 18px 22px;
    }

    .high-dividend-toolbar {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: space-between;
        margin-bottom: 16px;
    }

    .high-dividend-title {
        margin: 0;
        font-size: 22px;
        font-weight: 600;
    }

    .high-dividend-actions {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
        gap: 18px;
    }

    .filter-control {
        align-items: center;
        display: inline-flex;
        gap: 6px;
        font-size: 11px;
        line-height: 30px;
        margin: 0;
        margin-right: 12px;
    }

    .filter-control input {
        margin: 0;
    }

    .filter-control input[type="number"] {
        border: 1px solid #cfd6e4;
        border-radius: 3px;
        color: #1f2937;
        font-size: 12px;
        height: 28px;
        line-height: 20px;
        padding: 3px 6px;
        background: #fff;
        outline: none;
        box-sizing: border-box;
        -moz-appearance: textfield;
    }

    .filter-control input[type="number"]::-webkit-inner-spin-button,
    .filter-control input[type="number"]::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
    }

    .filter-control input[type="number"]:focus {
        border-color: #2563eb;
        box-shadow: inset 0 0 0 1px #2563eb;
    }

    .table-shell {
        background: #fff;
        border: 1px solid #cfd6e4;
        border-radius: 4px;
        overflow: hidden;
        display: inline-block;
        max-width: 100%;
        vertical-align: top;
    }

    .table-responsive {
        margin: 0;
        overflow-x: auto;
        max-width: calc(100vw - 46px);
    }

    .high-dividend-table {
        border-collapse: separate;
        border-spacing: 0;
        table-layout: fixed;
        margin: 0;
        width: auto;
        min-width: 0;
    }

    .table.high-dividend-table > thead > tr > th {
        background: #eef2f7;
        border-bottom: 1px solid #b8c1d1;
        border-right: 1px solid #cfd6e4;
        color: #344054;
        font-size: 12px;
        font-weight: 600;
        height: 32px;
        line-height: 20px;
        padding: 6px 8px;
        position: relative;
        text-align: center;
        vertical-align: middle;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .table.high-dividend-table > thead > tr > th:last-child,
    .table.high-dividend-table > tbody > tr > td:last-child {
        border-right: none;
    }

    .column-resizer {
        bottom: 0;
        cursor: col-resize;
        position: absolute;
        right: -4px;
        top: 0;
        width: 8px;
        z-index: 3;
    }

    .column-resizer:hover,
    .column-resizer.is-dragging {
        background: rgba(37, 99, 235, 0.18);
    }

    .sortable-header {
        cursor: pointer;
        user-select: none;
    }

    .sort-icon {
        color: #98a2b3;
        margin-left: 4px;
    }

    .table.high-dividend-table > tbody > tr > td {
        border-bottom: 1px solid #e5e7eb;
        border-right: 1px solid #d7ddea;
        font-size: 13px;
        height: 28px;
        line-height: 20px;
        overflow: hidden;
        padding: 3px 8px;
        text-align: center;
        text-overflow: ellipsis;
        vertical-align: middle;
        white-space: nowrap;
    }

    .high-dividend-table tbody tr:hover td {
        background: #f8fbff;
    }

    .number-cell {
        font-variant-numeric: tabular-nums;
        text-align: center;
        white-space: nowrap;
    }

    .yield-cell {
        color: #067647;
        font-weight: 600;
    }

    .warning-blue-cell {
        background: #B5D7FF;
    }

    .high-dividend-table tbody tr:hover td.warning-blue-cell {
        background: #B5D7FF;
    }

    .changed-name {
        color: #b42318;
        font-weight: 600;
    }

    .dividend-changed-name {
        color: #067647;
        font-weight: 600;
    }

    .name-cell-watched {
        background: #FFEBEE;
    }

    .high-dividend-table tbody tr:hover td.name-cell-watched {
        background: #FFEBEE;
    }

    .empty-state,
    .error-state {
        color: #667085;
        padding: 22px;
        text-align: center;
    }

    .error-state {
        color: #b42318;
    }

    @media (max-width: 768px) {
        .high-dividend-page {
            padding: 11px;
        }

        .high-dividend-actions {
            width: 100%;
        }
    }
</style>

<div class="high-dividend-page">
    <div class="high-dividend-toolbar">
        <div style="display: flex; align-items: center; gap: 18px;">
            <h1 class="high-dividend-title" style="margin: 0;">高股息列表</h1>
            <label class="filter-control" title="勾选后隐藏扣非低于-10%或每股收益为负的股票">
                <span>过滤扣非与亏损</span>
                <input id="negativeEpsFilter" type="checkbox" checked>
            </label>
            <label class="filter-control" title="勾选后仅显示已关注的股票">
                <span>关注</span>
                <input id="watchFilter" type="checkbox">
            </label>
            <label class="filter-control" title="股息率低于此值的股票将被隐藏">
                <span>最低股息率%</span>
                <input id="minDividendYieldFilter" type="number" step="0.1" min="0" placeholder="0" style="width: 36px;">
            </label>
            <label class="filter-control" title="市值低于此值的股票将被隐藏（亿元）">
                <span>最低市值</span>
                <input id="minMarketCapFilter" type="number" step="1" min="0" placeholder="0" style="width: 62px;">
            </label>
        </div>
    </div>

    <div class="table-shell">
        <div class="table-responsive">
            <table id="highDividendTable" class="table table-hover high-dividend-table">
                <colgroup>
                    <col style="width: 86px;">
                    <col style="width: 132px;">
                    <col style="width: 96px;">
                    <col style="width: 96px;">
                    <col style="width: 112px;">
                    <col style="width: 112px;">
                    <col style="width: 112px;">
                    <col style="width: 112px;">
                    <col style="width: 112px;">
                    <col style="width: 100px;">
                    <col style="width: 82px;">
                </colgroup>
                <thead>
                    <tr>
                        <th>代码<span class="column-resizer"></span></th>
                        <th class="sortable-header" data-sort-key="name">名称<i class="fa fa-sort sort-icon"></i><span class="column-resizer"></span></th>
                        <th class="number-cell sortable-header" data-sort-key="deducted_profit_growth">扣非<i class="fa fa-sort sort-icon"></i><span class="column-resizer"></span></th>
                        <th class="number-cell sortable-header" data-sort-key="dividend_yield">股息率<i class="fa fa-sort sort-icon"></i><span class="column-resizer"></span></th>
                        <th class="number-cell">息增年<span class="column-resizer"></span></th>
                        <th class="number-cell">FCF/股息<span class="column-resizer"></span></th>
                        <th class="number-cell sortable-header" data-sort-key="fcf_price">FCF/股价<i class="fa fa-sort sort-icon"></i><span class="column-resizer"></span></th>
                        <th class="number-cell sortable-header" data-sort-key="ma120_position">日MA120<i class="fa fa-sort sort-icon"></i><span class="column-resizer"></span></th>
                        <th class="sortable-header" data-sort-key="industry_name">行业<i class="fa fa-sort sort-icon"></i><span class="column-resizer"></span></th>
                        <th class="number-cell sortable-header" data-sort-key="market_cap">市值<i class="fa fa-sort sort-icon"></i><span class="column-resizer"></span></th>
                        <th class="number-cell sortable-header" data-sort-key="low20_bounce">反弹<i class="fa fa-sort sort-icon"></i><span class="column-resizer"></span></th>
                    </tr>
                </thead>
                <tbody id="dividendRows">
                    <tr>
                        <td class="empty-state" colspan="10">加载中...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script type="text/javascript">
    let highDividendRows = [];
    let sortState = {
        key: "name",
        direction: "asc"
    };
    const FILTER_STORAGE_KEY = "highDividendNegativeEpsFilterEnabled";
    const MIN_DIVIDEND_YIELD_STORAGE_KEY = "highDividendMinDividendYield";
    const MIN_MARKET_CAP_STORAGE_KEY = "highDividendMinMarketCap";
    const SORT_STORAGE_KEY = "highDividendSortState";

    let watchList = [];
    function formatNumber(value, digits) {
        if (value === null || value === undefined || Number.isNaN(Number(value))) {
            return "--";
        }
        return Number(value).toFixed(digits);
    }

    function formatPercent(value, digits) {
        if (digits === undefined) digits = 2;
        if (value === null || value === undefined || Number.isNaN(Number(value))) {
            return "--";
        }
        return Number(value).toFixed(digits) + "%";
    }

    function formatBlankPercent(value, digits) {
        if (digits === undefined) digits = 2;
        if (value === null || value === undefined || value === "" || Number.isNaN(Number(value))) {
            return "";
        }
        return Number(value).toFixed(digits) + "%";
    }

    function formatSignedPercent(value) {
        if (value === null || value === undefined || value === "" || Number.isNaN(Number(value))) {
            return "";
        }
        const number = Number(value);
        return (number > 0 ? "+" : "") + number.toFixed(2) + "%";
    }

    function formatOptionalNumber(value, digits) {
        if (value === null || value === undefined || value === "" || Number.isNaN(Number(value))) {
            return "";
        }
        return Number(value).toFixed(digits);
    }

    function normalizeNumber(value) {
        const text = String(value || "").trim().replace(/,/g, "");
        const match = text.match(/-?\d+(\.\d+)?/);
        return match ? match[0] : "";
    }

    function escapeHtml(value) {
        return String(value || "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function compareRows(left, right) {
        const leftPinned = Boolean(left && (left.dividend_changed || left.finance_report_changed));
        const rightPinned = Boolean(right && (right.dividend_changed || right.finance_report_changed));
        if (leftPinned !== rightPinned) {
            return leftPinned ? -1 : 1;
        }

        const direction = sortState.direction === "asc" ? 1 : -1;
        if (sortState.key === "name") {
            return direction * String(left.name || "").localeCompare(String(right.name || ""), "zh-Hans-CN");
        }
        if (sortState.key === "industry_name") {
            return direction * String(left.industry_name || "").localeCompare(String(right.industry_name || ""), "zh-Hans-CN");
        }
        if (sortState.key === "deducted_profit_growth") {
            return direction * (parseNullableNumber(left.deducted_profit_growth) - parseNullableNumber(right.deducted_profit_growth));
        }
        if (sortState.key === "fcf_price") {
            return direction * (parseNullableNumber(left.fcf_price) - parseNullableNumber(right.fcf_price));
        }
        if (sortState.key === "ma120_position") {
            return direction * (parseNullableNumber(left.ma120_position) - parseNullableNumber(right.ma120_position));
        }
        if (sortState.key === "market_cap") {
            return direction * (parseNullableNumber(left.market_cap) - parseNullableNumber(right.market_cap));
        }
        if (sortState.key === "low20_bounce") {
            return direction * (parseNullableNumber(left.low20_bounce) - parseNullableNumber(right.low20_bounce));
        }

        const leftValue = left.dividend_yield === null || left.dividend_yield === undefined ? -Infinity : Number(left.dividend_yield);
        const rightValue = right.dividend_yield === null || right.dividend_yield === undefined ? -Infinity : Number(right.dividend_yield);
        return direction * (leftValue - rightValue);
    }

    function parseNullableNumber(value) {
        if (value === null || value === undefined || value === "" || Number.isNaN(Number(value))) {
            return -Infinity;
        }
        return Number(value);
    }

    function loadWatchList() {
        return $.getJSON("/instock/high_dividend/followlist")
            .done(function(payload) {
                watchList = payload.follow_codes || [];
            })
            .fail(function() {
                watchList = [];
            });
    }

    function isWatched(code) {
        return watchList.indexOf(code) !== -1;
    }

    function toggleWatch(code) {
        $.getJSON("/instock/high_dividend/followlist", {toggle: code})
            .done(function(payload) {
                if (payload.followed) {
                    if (watchList.indexOf(code) === -1) {
                        watchList.push(code);
                    }
                } else {
                    const idx = watchList.indexOf(code);
                    if (idx !== -1) {
                        watchList.splice(idx, 1);
                    }
                }
                renderRows(highDividendRows);
            })
            .fail(function() {
                // 切换失败，刷新列表以保持同步
                loadWatchList();
            });
    }

    function isWatchFilterEnabled() {
        return document.getElementById("watchFilter").checked;
    }

    function sortedRows(rows) {
        return (rows || []).slice().sort(compareRows);
    }

    function shouldHideByFilter(row) {
        if (document.getElementById("negativeEpsFilter").checked) {
            const hasNegativeEps = !(
                row.diluted_eps === null
                || row.diluted_eps === undefined
                || row.diluted_eps === ""
                || Number.isNaN(Number(row.diluted_eps))
            ) && Number(row.diluted_eps) < 0;
            const hasWeakDeductedProfit = !(
                row.deducted_profit_growth === null
                || row.deducted_profit_growth === undefined
                || row.deducted_profit_growth === ""
                || Number.isNaN(Number(row.deducted_profit_growth))
            ) && Number(row.deducted_profit_growth) < -10;

            if (hasNegativeEps || hasWeakDeductedProfit) {
                return true;
            }
        }

        if (isWatchFilterEnabled()) {
            if (!isWatched(row.code)) {
                return true;
            }
        }

        const minDividendYield = parseFloat(document.getElementById("minDividendYieldFilter").value);
        if (!Number.isNaN(minDividendYield) && minDividendYield > 0) {
            if (row.dividend_yield === null || row.dividend_yield === undefined || row.dividend_yield === "" || Number.isNaN(Number(row.dividend_yield))) {
                return true;
            }
            if (Number(row.dividend_yield) < minDividendYield) {
                return true;
            }
        }

        const minMarketCap = parseFloat(document.getElementById("minMarketCapFilter").value);
        if (!Number.isNaN(minMarketCap) && minMarketCap > 0) {
            if (row.market_cap === null || row.market_cap === undefined || row.market_cap === "" || Number.isNaN(Number(row.market_cap))) {
                return true;
            }
            if (Number(row.market_cap) < minMarketCap) {
                return true;
            }
        }

        return false;
    }

    function visibleRows(rows) {
        return (rows || []).filter(function(row) {
            return !shouldHideByFilter(row);
        });
    }

    function displayedRows(rows) {
        return sortedRows(visibleRows(rows));
    }

    function isFilterEnabled() {
        return document.getElementById("negativeEpsFilter").checked;
    }

    function loadFilterState() {
        const savedValue = window.localStorage.getItem(FILTER_STORAGE_KEY);
        if (savedValue !== null) {
            document.getElementById("negativeEpsFilter").checked = savedValue === "true";
        }

        const savedMinDividendYield = window.localStorage.getItem(MIN_DIVIDEND_YIELD_STORAGE_KEY);
        if (savedMinDividendYield !== null) {
            document.getElementById("minDividendYieldFilter").value = savedMinDividendYield;
        }

        const savedMinMarketCap = window.localStorage.getItem(MIN_MARKET_CAP_STORAGE_KEY);
        if (savedMinMarketCap !== null) {
            document.getElementById("minMarketCapFilter").value = savedMinMarketCap;
        }
    }

    function saveFilterState() {
        window.localStorage.setItem(FILTER_STORAGE_KEY, String(isFilterEnabled()));
        window.localStorage.setItem(MIN_DIVIDEND_YIELD_STORAGE_KEY, document.getElementById("minDividendYieldFilter").value);
        window.localStorage.setItem(MIN_MARKET_CAP_STORAGE_KEY, document.getElementById("minMarketCapFilter").value);
    }

    function loadSortState() {
        try {
            const saved = JSON.parse(window.localStorage.getItem(SORT_STORAGE_KEY));
            if (saved && saved.key && saved.direction) {
                sortState.key = saved.key;
                sortState.direction = saved.direction;
            }
        } catch (error) {
            // ignore parse errors, keep defaults
        }
    }

    function saveSortState() {
        window.localStorage.setItem(SORT_STORAGE_KEY, JSON.stringify({
            key: sortState.key,
            direction: sortState.direction
        }));
    }

    function tableColumnCount() {
        return 11;
    }

    function updateSortIcons() {
        $(".sortable-header").each(function() {
            const header = $(this);
            const icon = header.find(".sort-icon");
            icon.removeClass("fa-sort fa-sort-asc fa-sort-desc");
            if (header.data("sort-key") === sortState.key) {
                icon.addClass(sortState.direction === "asc" ? "fa-sort-asc" : "fa-sort-desc");
            } else {
                icon.addClass("fa-sort");
            }
        });
    }

    function renderRows(rows) {
        const tbody = document.getElementById("dividendRows");
        const displayRows = displayedRows(rows);
        if (displayRows.length === 0) {
            tbody.innerHTML = '<tr><td class="empty-state" colspan="' + tableColumnCount() + '">暂无数据</td></tr>';
            return;
        }

        tbody.innerHTML = displayRows.map(function(row, index) {
            return [
                '<tr>',
                '<td><a href="https://xueqiu.com/S/' + (row.code.charAt(0) === '6' ? 'SH' : 'SZ') + row.code + '" target="_blank" rel="noopener noreferrer">',
                escapeHtml(row.code),
                '</a></td>',
                '<td class="name-cell',
                row.finance_report_changed ? ' changed-name' : (row.dividend_changed ? ' dividend-changed-name' : ''),
                isWatched(row.code) ? ' name-cell-watched' : '',
                '" data-code="', escapeHtml(row.code), '">',
                escapeHtml(row.name),
                '</td>',
                '<td class="number-cell',
                Number(row.deducted_profit_growth) < -10 ? ' warning-blue-cell' : '',
                '" title="',
                escapeHtml(row.deducted_profit_growth_report_name ? row.deducted_profit_growth_report_name + '，公告 ' + (row.deducted_profit_growth_notice_date || '--') : ''),
                '">',
                formatBlankPercent(row.deducted_profit_growth, 1),
                '</td>',
                '<td class="number-cell yield-cell" title="',
                escapeHtml(row.dividend_per_share != null ? '派息 ' + formatNumber(row.dividend_per_share, 2) + ' / 股价 ' + formatNumber(row.current_price, 2) : ''),
                '">',
                formatPercent(row.dividend_yield, 1),
                '</td>',
                '<td class="number-cell">',
                formatNumber(row.dividend_growth_years, 0),
                '</td>',
                '<td class="number-cell fcf-dividend-cell">',
                formatBlankPercent(row.fcf_dividend === null || row.fcf_dividend === undefined ? null : row.fcf_dividend * 100, 1),
                '</td>',
                '<td class="number-cell fcf-price-cell">',
                formatBlankPercent(row.fcf_price, 1),
                '</td>',
                '<td class="number-cell" title="',
                escapeHtml(row.ma120_trade_date ? row.ma120_trade_date + ' 收盘 ' + formatNumber(row.ma120_close_price, 2) + ' / MA120 ' + formatNumber(row.ma120, 2) : ''),
                '">',
                formatBlankPercent(row.ma120_position, 1),
                '</td>',
                '<td>',
                escapeHtml(row.industry_name || ""),
                '</td>',
                '<td class="number-cell">',
                formatOptionalNumber(row.market_cap, 0),
                '</td>',
                '<td class="number-cell" title="',
                escapeHtml(row.low20_trade_date ? row.low20_trade_date + ' 收盘 ' + formatNumber(row.low20_close_price, 2) + ' / 近20日盘中最低 ' + formatNumber(row.low20_lowest_low, 2) + '（' + row.low20_lowest_date + '）' : ''),
                '">',
                formatBlankPercent(row.low20_bounce, 1),
                '</td>',
                '</tr>'
            ].join('');
        }).join('');
        updateSortIcons();
    }

    function loadHighDividendList() {
        const tbody = document.getElementById("dividendRows");
        tbody.innerHTML = '<tr><td class="empty-state" colspan="' + tableColumnCount() + '">加载中...</td></tr>';

        $.getJSON("/instock/high_dividend/api")
            .done(function(payload) {
                highDividendRows = payload.data || [];
                renderRows(highDividendRows);
                if (payload.errors && payload.errors.length > 0) {
                    console.warn(payload.errors.join("\\n"));
                }
            })
            .fail(function(xhr) {
                let message = xhr.statusText || xhr.status;
                if (xhr.responseJSON && xhr.responseJSON.message) {
                    message = xhr.responseJSON.message;
                }
                tbody.innerHTML = '<tr><td class="error-state" colspan="' + tableColumnCount() + '">数据读取失败：' + escapeHtml(message) + '</td></tr>';
            });
    }

    function startAfterCloseDividendRefresh() {
        window.setInterval(function() {
            const hour = new Date().getHours();
            if (hour >= 16 && hour <= 23) {
                loadHighDividendList();
            }
        }, 60 * 60 * 1000);
    }

    function loadColumnWidths() {
        try {
            return JSON.parse(window.localStorage.getItem("highDividendColumnWidths") || "[]");
        } catch (error) {
            return [];
        }
    }

    function saveColumnWidths(widths) {
        window.localStorage.setItem("highDividendColumnWidths", JSON.stringify(widths));
    }

    function applyColumnWidths() {
        const widths = loadColumnWidths();
        const cols = $(".high-dividend-table col");
        widths.forEach(function(width, index) {
            if (width && cols[index]) {
                cols[index].style.width = width + "px";
            }
        });
    }

    function initColumnResizing() {
        applyColumnWidths();
        $(".column-resizer").on("mousedown", function(event) {
            event.preventDefault();
            event.stopPropagation();
            const handle = $(this);
            const th = handle.closest("th")[0];
            const index = $(th).index();
            const col = $(".high-dividend-table col")[index];
            const startX = event.pageX;
            const startWidth = parseInt($(col).width(), 10) || parseInt($(th).outerWidth(), 10);
            const minWidth = Math.max(64, startWidth - 160);
            const maxWidth = startWidth + 220;
            handle.addClass("is-dragging");

            $(document).on("mousemove.highDividendResize", function(moveEvent) {
                const nextWidth = Math.min(maxWidth, Math.max(minWidth, startWidth + moveEvent.pageX - startX));
                col.style.width = nextWidth + "px";
            });

            $(document).on("mouseup.highDividendResize", function() {
                const widths = $(".high-dividend-table col").map(function() {
                    return parseInt($(this).width(), 10);
                }).get();
                saveColumnWidths(widths);
                handle.removeClass("is-dragging");
                $(document).off(".highDividendResize");
            });
        });
    }

    $(document).ready(function() {
        initColumnResizing();
        loadFilterState();
        loadSortState();
        $("#negativeEpsFilter").on("change", function() {
            saveFilterState();
            renderRows(highDividendRows);
        });
        $("#minDividendYieldFilter").on("change input", function() {
            saveFilterState();
            renderRows(highDividendRows);
        });
        $("#minMarketCapFilter").on("change input", function() {
            saveFilterState();
            renderRows(highDividendRows);
        });
        $("#watchFilter").on("change", function() {
            renderRows(highDividendRows);
        });
        $("#dividendRows").on("click", "td.name-cell", function() {
            const code = $(this).attr("data-code");
            if (code) {
                toggleWatch(code);
            }
        });
        $(".sortable-header").on("click", function() {
            const key = $(this).data("sort-key");
            if (sortState.key === key) {
                sortState.direction = sortState.direction === "asc" ? "desc" : "asc";
            } else {
                sortState.key = key;
                sortState.direction = key === "name" ? "asc" : "desc";
            }
            saveSortState();
            renderRows(highDividendRows);
        });
        loadWatchList().done(function() {
            loadHighDividendList();
        });
        startAfterCloseDividendRefresh();
    });
</script>
{% end %}
